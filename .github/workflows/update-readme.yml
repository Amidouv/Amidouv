name: Update profile README

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # keyless AWS auth via OIDC, used for Bedrock

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bedrock path: set repo variables AWS_ROLE_ARN, AWS_REGION and BEDROCK_MODEL_ID.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install boto3 for Bedrock
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: pip install --quiet boto3

      - name: Refresh AI summary and activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEDROCK_MODEL_ID: ${{ vars.AWS_ROLE_ARN != '' && vars.BEDROCK_MODEL_ID || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh AI-generated profile sections"
          git push
