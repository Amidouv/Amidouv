<svg xmlns="http://www.w3.org/2000/svg" width="880" height="256" viewBox="0 0 880 256" role="img" aria-label="Amiel Botbol, Platform &amp; AI Engineer. I turn observability chaos into code, and alerts into answers. Now building: An AIOps copilot: Bedrock LLMs that read Splunk, Dynatrace and the data lake through MCP servers to explain incidents and predict the next one.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ekg { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 4s linear infinite; }
  .blink { animation: blink 1.4s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
</style>
<rect x=".5" y=".5" width="879" height="255" rx="14" fill="#0d1117" stroke="#30363d"/>

