  <linearGradient id="fadeR" gradientUnits="userSpaceOnUse" x1="520" x2="850"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".5" stop-color="#3fb950" stop-opacity=".9"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
</defs>
<path d="M 520 104 l 40 0 l 8 -6 l 6 6 l 10 0 l 6 -34 l 8 58 l 6 -24 l 10 0 l 10 -8 l 10 8 l 40 0 l 40 0 l 8 -6 l 6 6 l 10 0 l 6 -34 l 8 58 l 6 -24 l 10 0 l 10 -8 l 10 8 " fill="none" stroke="url(#fadeR)" stroke-width="2" stroke-linejoin="round" class="ekg" opacity=".9"/>
<text x="40" y="66" fill="#e6edf3" font-weight="800" style="font-size:44px;letter-spacing:-1px" class="fade">Amiel Botbol</text>
<text x="40" y="104" fill="url(#role)" font-weight="700" style="font-size:24px;animation-delay:.25s" class="fade">Platform &amp; AI Engineer</text>
<text x="40" y="136" fill="#8b949e" style="font-size:16px;animation-delay:.5s" class="fade">I turn observability chaos into code, and alerts into answers.</text>
<g class="fade" style="animation-delay:.9s">
  <line x1="40" y1="166" x2="840" y2="166" stroke="#21262d"/>
  <circle cx="48" cy="210" r="5" fill="#3fb950" class="blink"/>
  <text x="64" y="192" fill="#8b949e" class="mono" style="font-size:11px;letter-spacing:1px">NOW BUILDING  ·  WRITTEN WEEKLY BY AI ON AMAZON BEDROCK</text>
  <text x="64" y="215" fill="#e6edf3" class="mono" style="font-size:13px">An AIOps copilot: Bedrock LLMs that read Splunk, Dynatrace and the data lake through MCP servers</text><text x="64" y="235" fill="#e6edf3" class="mono" style="font-size:13px">to explain incidents and predict the next one.</text>
