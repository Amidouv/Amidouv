<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Amiel Botbol: Platform Engineer · SRE · AWS Architect">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
  .ln { opacity: 0; animation: show .01s forwards; }
  .cur { opacity: 0; animation: blink 1s step-end infinite; }
  @keyframes show { to { opacity: 1; } }
  @keyframes type { to { transform: translateX(var(--w)); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
<rect width="880" height="470" rx="12" fill="#0d1117" stroke="#30363d"/>
<circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
<text x="440.0" y="27" text-anchor="middle" fill="#8b949e" style="font-size:13px">amiel@prod: ~</text>
<line x1="0" y1="40" x2="880" y2="40" stroke="#21262d"/>
<text x="24" y="64"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#e6edf3">kubectl describe engineer amiel</tspan></text><rect x="22" y="47" width="307" height="24" fill="#0d1117" style="animation:type 1.16s steps(33) 0.40s both;--w:307px"/>
<text x="24" y="88" class="ln" style="animation-delay:1.81s"><tspan fill="#79c0ff">  Name:     </tspan><tspan fill="#e6edf3">Amiel Botbol</tspan></text>
<text x="24" y="112" class="ln" style="animation-delay:1.93s"><tspan fill="#79c0ff">  Role:     </tspan><tspan fill="#e6edf3">Platform Engineer · SRE · AWS Architect</tspan></text>
<text x="24" y="136" class="ln" style="animation-delay:2.05s"><tspan fill="#79c0ff">  Focus:    </tspan><tspan fill="#e6edf3">Golden paths · SLOs · Cloud cost · GenAI</tspan></text>
<text x="24" y="160" class="ln" style="animation-delay:2.17s"><tspan fill="#79c0ff">  Status:   </tspan><tspan fill="#3fb950" font-weight="700">● Running</tspan><tspan fill="#8b949e">  open to Platform, SRE and R&amp;D roles</tspan></text>
<text x="24" y="184" class="ln" style="animation-delay:2.29s"><tspan fill="#e6edf3"></tspan></text>
<text x="24" y="208"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#e6edf3">kubectl get skills</tspan></text><rect x="22" y="191" width="190" height="24" fill="#0d1117" style="animation:type 0.70s steps(20) 2.41s both;--w:190px"/>
<text x="24" y="232" class="ln" style="animation-delay:3.36s"><tspan fill="#8b949e">  NAME          STACK</tspan></text>
<text x="24" y="256" class="ln" style="animation-delay:3.48s"><tspan fill="#d2a8ff">  platform      </tspan><tspan fill="#e6edf3">Kubernetes  ArgoCD  Docker  Jenkins  GitHub Actions</tspan></text>
<text x="24" y="280" class="ln" style="animation-delay:3.60s"><tspan fill="#d2a8ff">  reliability   </tspan><tspan fill="#e6edf3">OpenTelemetry  Dynatrace  Splunk  Prometheus</tspan></text>
<text x="24" y="304" class="ln" style="animation-delay:3.72s"><tspan fill="#d2a8ff">  cloud         </tspan><tspan fill="#e6edf3">AWS  Linux/RHEL  IAM  Well-Architected</tspan></text>
<text x="24" y="328" class="ln" style="animation-delay:3.84s"><tspan fill="#d2a8ff">  ai            </tspan><tspan fill="#e6edf3">Bedrock  Claude  Claude Code</tspan></text>
<text x="24" y="352" class="ln" style="animation-delay:3.96s"><tspan fill="#e6edf3"></tspan></text>
<text x="24" y="376"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#e6edf3">amiel --now</tspan></text><rect x="22" y="359" width="127" height="24" fill="#0d1117" style="animation:type 0.50s steps(13) 4.08s both;--w:127px"/>
<text x="24" y="400" class="ln" style="animation-delay:4.83s"><tspan fill="#ffa657">  Building self-service delivery on Kubernetes and AWS, and adding LLM features with AWS</tspan></text>
<text x="24" y="424" class="ln" style="animation-delay:4.95s"><tspan fill="#ffa657">  Bedrock.</tspan></text>
<text x="24" y="448" class="ln" style="animation-delay:5.07s"><tspan fill="#3fb950" font-weight="700">$ </tspan></text><rect x="42.0" y="435" width="9.0" height="17" fill="#e6edf3" class="cur" style="animation-delay:5.07s"/>
</svg>
